name: render-health
on:
  push:
    branches: [diag/render-health]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd backend && npm ci --ignore-scripts
      - run: |
          cd backend
          timeout 900 node scripts/simulate-game.mjs 3 https://boardgame-tc.onrender.com > sim.txt 2>&1 || true
          echo "::notice title=sim-results::$(sed -n '/=== RESULTS ===/,$p' sim.txt | tr '\n' ' ' | head -c 1500)"
          echo "::notice title=sim-tail::$(tail -c 1200 sim.txt | tr '\n' ' ')"
